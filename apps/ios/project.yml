# XcodeGen spec — source of truth for IdeaRelay.xcodeproj.
# Regenerate with:  cd apps/ios && xcodegen generate
# The .xcodeproj is generated; commit project.yml, not the pbxproj.
name: IdeaRelay

options:
  bundleIdPrefix: dev.idearelay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # tus 1.0.0 client for the Hub's /upload endpoint (spec §12.1 Uploader).
  # Pinned exact; bump deliberately.
  TUSKit:
    url: https://github.com/tus/TUSKit.git
    exactVersion: 3.7.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Approachable concurrency (SE-0466): unannotated code is @MainActor.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IdeaRelay:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IdeaRelay
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.idearelay.IdeaRelay
        PRODUCT_NAME: IdeaRelay
        INFOPLIST_FILE: IdeaRelay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        CODE_SIGN_STYLE: Automatic
        # Leave DEVELOPMENT_TEAM empty in the checked-in spec; the owner selects
        # their Personal Team once in Xcode -> Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: TUSKit

schemes:
  IdeaRelay:
    build:
      targets:
        IdeaRelay: all
    run:
      config: Debug
    archive:
      config: Release
